[project]
name = "pysync-client-cli"
version = "0.1.0"
description = "PySync daemon and management CLI for macOS and Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["watchdog>=6,<7", "websockets>=14,<18", "httpx>=0.28,<1", "typer>=0.15,<1", "rich>=13", "pydantic-settings>=2.7", "platformdirs>=4", "pathspec>=0.12,<1", "pysync-shared"]

[project.scripts]
pysync-client-cli = "pysync_client_cli.main:main"

[tool.uv.sources]
pysync-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
